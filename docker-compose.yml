version: '3.8'

services:
  app:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - .:/app

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: 
